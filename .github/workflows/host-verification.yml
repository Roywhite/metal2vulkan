name: Reims host and QEMU regression

on:
  push:
    branches: [steelbrain/pr-ready-verification-20261110]
    paths: [.github/workflows/host-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  host-regressions:
    name: Reims stable API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    defaults:
      run:
        shell: bash
        working-directory: host
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: ${{ github.workspace }}/host-target
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Roywhite/reims-vgpu
          ref: a469abff23c2447daddfd58845cafddd98ea7e57
          path: host
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host -> ../host-target
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cbindgen@0.29.4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm spirv-tools cmake ninja-build pkg-config python3-venv python3-pip libglib2.0-dev libpixman-1-dev zlib1g-dev libvulkan-dev mesa-vulkan-drivers libva-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdbus-1-dev libfdt-dev flex bison libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld spirv-tools
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Confirm exact sources and dependency
        run: |
          test "$(git rev-parse HEAD)" = a469abff23c2447daddfd58845cafddd98ea7e57
          cargo metadata --format-version 1 > "$RUNNER_TEMP/host-metadata.json"
          python3 - <<'PY'
          import json, os
          metadata = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'host-metadata.json')))
          runtime = next(p for p in metadata['packages'] if p['name'] == 'metal2vulkan-runtime')
          assert runtime['source'].endswith('#a0058f220635342f22451d9a59b592de5af10068'), runtime['source']
          print('Verified public runtime dependency:', runtime['source'])
          PY
      - name: Upstream library gates
        id: upstream
        continue-on-error: true
        run: |
          ulimit -c 0
          cargo xtask check
      - name: Build C API against real public dependency
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build -p reims-vgpu-c --no-default-features --features vulkan
          else
            cargo build -p reims-vgpu-c
          fi
      - uses: actions/checkout@v4
        with:
          repository: Roywhite/qemu-reims-vgpu
          ref: 105fcf56f9b42b7cbfd03c87264b907446c5dc3c
          path: qemu
          persist-credentials: false
      - name: Build matched Unix SDK and QEMU
        run: |
          cargo xtask dist --profile dev --out "$RUNNER_TEMP/reims-sdk"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/reims-sdk/lib/pkgconfig"
          mkdir -p "$GITHUB_WORKSPACE/qemu-build"
          cd "$GITHUB_WORKSPACE/qemu-build"
          if [ "$RUNNER_OS" = macOS ]; then
            target=aarch64-softmmu
          else
            target=x86_64-softmmu
          fi
          ../qemu/configure --target-list="$target" --enable-pvg --disable-docs --disable-tools --disable-rust --disable-cocoa --disable-linux-user --disable-bsd-user
          ninja -j2

      - name: Isolate GPU-sensitive tests on head and upstream base
        if: runner.os == 'Linux'
        id: gpu_sensitive
        continue-on-error: true
        run: |
          set -euo pipefail
          head=a469abff23c2447daddfd58845cafddd98ea7e57
          base=1fe0acb68b287db36f1e6c7b9f45383940b8a76f
          git fetch --depth=1 origin "$base"
          trap 'git checkout --detach "$head"' EXIT
          for revision in "$head" "$base"; do
            git checkout --detach "$revision"
            log="$RUNNER_TEMP/gpu-sensitive-$revision.log"
            set +e
            cargo nextest run -p reims-vgpu-vulkan --lib --no-fail-fast --test-threads 1 \
              -E 'test(=gpu::caps::tests::simd_flags_answer_the_runtimes_family_rows) | test(=gpu::device::tests::a_released_surface_texture_keeps_the_surfaces_memory_while_imported) | test(=gpu::paging_discard::a_discarded_multisampled_texture_keeps_its_transfer_buffer_until_the_write_back_completed)' > "$log" 2>&1
            result=$?
            set -e
            cat "$log"
            echo "GPU-sensitive outcome for $revision: $result"
            if [ "$revision" = "$head" ]; then head_result=$result; fi
          done
          test "$head_result" -eq 0
      - name: Preserve genuine upstream gate outcome
        if: always() && (steps.upstream.outcome != 'success' || steps.gpu_sensitive.outcome == 'failure')
        run: |
          echo 'The upstream gate failed; downstream build evidence does not override it.'
          exit 1
